# ==============================================================================
# 启煊软件企业级智能体 (Qixuan Agent) 核心配置文件
# 基于 Hermes Agent 架构规范定制 | 适配 Hugging Face Inference Providers
# ==============================================================================

agent:
  name: "Qixuan-Agent"
  organization: "启煊软件 (Qixuan Software)"
  default_profile: "default"
  timezone: "Asia/Shanghai"
  language: "zh-CN"
  max_iterations: 40
  enable_self_learning: true

# ------------------------------------------------------------------------------
# 1. 模型与 Hugging Face 混合算力路由配置
# ------------------------------------------------------------------------------
models:
  # 主大脑：负责复杂任务拆解、长程规划与多工具编排
  primary:
    provider: "huggingface"
    model: "zai-org/GLM-5.1"
    base_url: "https://router.huggingface.co/v1"
    api_key_env: "HF_TOKEN"
    temperature: 0.2
    max_tokens: 16384
    timeout: 120

  # 代码与研发主力：负责需求技术拆解、Code Review 与架构设计
  coding:
    provider: "huggingface"
    model: "Qwen/Qwen3-235B-A22B"
    base_url: "https://router.huggingface.co/v1"
    api_key_env: "HF_TOKEN"
    temperature: 0.1
    max_tokens: 32768

  # 轻量路由与摘要模型：用于意图分类、上下文压缩与记忆提炼
  fast:
    provider: "huggingface"
    model: "deepseek-ai/DeepSeek-V4-Flash:cheapest"
    base_url: "https://router.huggingface.co/v1"
    api_key_env: "HF_TOKEN"
    temperature: 0.1
    max_tokens: 4096

  # 涉密项目本地私有化节点：数据零出网，物理隔离运行
  confidential_local:
    provider: "openai_compatible"
    model: "google/gemma-4-26b-a4b-it"
    base_url: "http://qixuan-local-vllm:8000/v1"
    api_key_env: "LOCAL_VLLM_API_KEY"
    temperature: 0.1
    max_tokens: 8192

  # 企业知识库向量模型
  embedding:
    provider: "openai_compatible"
    model: "BAAI/bge-m3"
    base_url: "http://qixuan-local-embedding:8080/v1"
    api_key_env: "LOCAL_EMBEDDING_KEY"

# 智能路由规则
routing:
  # 当会话或项目标记为 confidential 时，强制切断云端模型，仅走本地节点
  confidential_profile_route: "confidential_local"
  # 触发代码与需求分析技能时自动切换至 coding 模型
  skill_model_overrides:
    qixuan-req-analyzer: "coding"
    qixuan-code-reviewer: "coding"

# ------------------------------------------------------------------------------
# 2. 三层持久化记忆系统配置
# ------------------------------------------------------------------------------
memory:
  storage_dir: "/app/data/profiles"
  sqlite_db_name: "qixuan_memory.db"
  enable_fts5_search: true
  context_budget:
    user_md_max_tokens: 1500
    memory_md_max_tokens: 2500
  auto_summarize_threshold_tokens: 24000

# ------------------------------------------------------------------------------
# 3. 技能库 (Skills) 配置
# ------------------------------------------------------------------------------
skills:
  directories:
    - "/app/skills/builtin"
    - "/app/skills/qixuan"
  auto_load: true
  git_sync:
    enabled: true
    repo_url: "https://git.qixuan-soft.internal/ai/qixuan-agent-skills.git"
    branch: "main"
    sync_interval_minutes: 30

# ------------------------------------------------------------------------------
# 4. 安全执行沙盒与企业治理 (HITL)
# ------------------------------------------------------------------------------
sandbox:
  backend: "docker"
  image: "python:3.11-slim"
  network_mode: "bridge"
  cpu_limit: "2.0"
  memory_limit: "2g"
  execution_timeout_seconds: 60
  allowed_workspace_dirs:
    - "/app/workspace"

governance:
  audit_log_path: "/app/logs/audit.jsonl"
  # 高危工具调用前必须通过企业聊天软件发送确认卡片
  human_in_the_loop:
    enabled: true
    approval_timeout_seconds: 600
    require_approval_tools:
      - "git_push"
      - "db_execute_write"
      - "send_external_email"
      - "deploy_staging"

# ------------------------------------------------------------------------------
# 5. 企业多端接入网关 (按需启用对应平台)
# ------------------------------------------------------------------------------
gateways:
  feishu:
    enabled: true
    app_id_env: "FEISHU_APP_ID"
    app_secret_env: "FEISHU_APP_SECRET"
    verification_token_env: "FEISHU_VERIFICATION_TOKEN"
    encrypt_key_env: "FEISHU_ENCRYPT_KEY"

  dingtalk:
    enabled: false
    client_id_env: "DINGTALK_CLIENT_ID"
    client_secret_env: "DINGTALK_CLIENT_SECRET"

  wecom:
    enabled: false
    corp_id_env: "WECOM_CORP_ID"
    agent_id_env: "WECOM_AGENT_ID"
    secret_env: "WECOM_SECRET"

# ------------------------------------------------------------------------------
# 6. 定时任务调度 (Cron Jobs)
# ------------------------------------------------------------------------------
cron:
  enabled: true
  jobs:
    - name: "daily_ops_inspection"
      schedule: "0 8 * * 1-5"
      skill: "qixuan-ops-sentinel"
      prompt: "执行工作日早间客户环境健康巡检，并向运维群推送简报。"
